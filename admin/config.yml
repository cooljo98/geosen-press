backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "🏠 Home Page"
    files:
      - file: "content/home.json"
        label: "Home Content"
        name: "home"
        fields:
          - {label: "Top Tag", name: "tag", widget: "string"}
          - {label: "Main Heading Line 1", name: "heading1", widget: "string"}
          - {label: "Main Heading Line 2", name: "heading2", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - label: "Why Choose Us"
            name: "features"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
          - {label: "Connection Statement", name: "connection", widget: "string"}
          - {label: "Connection Description", name: "connection_description", widget: "text"}
          - label: "Education Program Highlights"
            name: "education_programs"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Impact Points"
            name: "impact_points"
            widget: "list"
            field: {label: "Point", name: "point", widget: "string"}

  - name: "about"
    label: "📖 About Page"
    files:
      - file: "content/about.json"
        label: "About Us Content"
        name: "about"
        fields:
          - {label: "Main Heading", name: "heading", widget: "string"}
          - {label: "Main Paragraph", name: "paragraph", widget: "text"}
          - {label: "Our Mission", name: "mission", widget: "text"}
          - {label: "Our Vision", name: "vision", widget: "text"}
          - {label: "Association", name: "association", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - label: "What Makes Us Different"
            name: "points"
            widget: "list"
            field: {label: "Point", name: "point", widget: "string"}

  - name: "programs"
    label: "🤖 Programs Page"
    files:
      - file: "content/programs.json"
        label: "All Programs"
        name: "programs"
        fields:
          - label: "Programs List"
            name: "programs"
            widget: "list"
            fields:
              - {label: "Program Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - label: "Program Details"
                name: "details"
                widget: "list"
                field: {label: "Detail", name: "detail", widget: "string"}
              - {label: "Outcome Text", name: "outcome", widget: "string"}

  - name: "gallery"
    label: "🖼️ Gallery"
    files:
      - file: "content/gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        fields:
          - label: "Gallery Images"
            name: "images"
            widget: "list"
            fields:
              - {label: "Photo Title", name: "title", widget: "string"}
              - {label: "Upload Photo", name: "image", widget: "image"}

  - name: "settings"
    label: "⚙️ Settings & Contact"
    files:
      - file: "content/settings.json"
        label: "Contact Info & Social Links"
        name: "settings"
        fields:
          - {label: "Email Address", name: "email", widget: "string"}
          - {label: "Phone Number", name: "phone", widget: "string"}
          - {label: "Physical Address", name: "address", widget: "string"}
          - {label: "WhatsApp Link", name: "whatsapp_link", widget: "string"}
          - {label: "Facebook Page Link", name: "facebook", widget: "string"}
          - {label: "Instagram Link", name: "instagram", widget: "string"}
          - {label: "LinkedIn Link", name: "linkedin", widget: "string"}
          - {label: "X / Twitter Link", name: "twitter", widget: "string"}
